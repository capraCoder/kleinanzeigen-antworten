# Copy to config.toml and adjust. Every section is optional.

title = "Antworten: Flohmarkt"
timezone = "Europe/Berlin"
full_names = false          # false: show "Anna B." instead of the full name

# Nicer labels for your ads, by ad number (Anzeigennummer). Without this the mail's title is used.
[ads]
"1234567890" = "Sofa, grau, 3-Sitzer"
"1234567891" = "Kinderfahrrad 20 Zoll"

# Reply templates: one button each under the draft box.
[[replies]]
label = "Noch da?"
text = "Ja, ist noch da. Wann möchten Sie es abholen?"

[[replies]]
label = "Kein Versand"
text = "Nur Abholung mit Barzahlung, kein Versand. Danke für Ihr Verständnis."

[[replies]]
label = "Schon weg"
text = "Leider schon vergeben. Danke für Ihr Interesse."

# Optional countdown in the header, with phases (e.g. a price drop).
# [deadline]
# end = "2026-12-06T12:00:00+01:00"
# label = "Abholung endet"
# phases = [
#   { from = "2026-12-05T10:00:00+01:00", label = "halber Preis" },
# ]

# Only for --imap. The password is NOT stored here: set KA_IMAP_PASSWORD or type it when asked.
# For Gmail use an app password (https://myaccount.google.com/apppasswords).
[imap]
host = "imap.gmail.com"
user = "du@example.com"
folder = "INBOX"
days = 14
