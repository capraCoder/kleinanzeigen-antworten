[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ka-antworten"
version = "0.1.0"
description = "Local reply desk for Kleinanzeigen sellers, built only from the notification e-mails"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]
keywords = ["kleinanzeigen", "email", "imap", "mbox", "seller"]

[project.scripts]
ka-antworten = "ka_antworten.__main__:main"

[tool.setuptools]
packages = ["ka_antworten"]

[tool.setuptools.package-data]
ka_antworten = ["page.html"]
